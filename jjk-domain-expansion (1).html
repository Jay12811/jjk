<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>領域展開</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+JP:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Noto Serif JP',serif}

/* ── CAMERA ── */
#cam{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;transform:scaleX(-1);z-index:1;
  filter:saturate(0.55) brightness(0.58) contrast(1.1);
  transition:filter 1.4s ease;
}
body.gojo-active   #cam{filter:saturate(0.1) brightness(0.28) contrast(1.4) hue-rotate(200deg)}
body.sukuna-active #cam{filter:saturate(0.08) brightness(0.2) contrast(1.5) sepia(0.7) hue-rotate(-15deg)}

/* ── OVERLAY CANVAS ── */
#overlay{position:fixed;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none;z-index:7}

/* ── VIGNETTE ── */
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 22%,rgba(0,0,0,0.82) 100%)}

/* ══════════════════════════════
   GOJO FX
══════════════════════════════ */
#gojo-fx{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.1s}
body.gojo-active #gojo-fx{opacity:1}

#g-grid{
  position:absolute;inset:-10%;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 79px,rgba(60,170,255,0.05) 80px),
    repeating-linear-gradient(90deg,transparent,transparent 79px,rgba(60,170,255,0.05) 80px);
  animation:gGrid 9s linear infinite;
}
#g-radial{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(30,100,255,0.2) 0%,rgba(0,40,180,0.1) 45%,transparent 70%);
  animation:breathe 3.2s ease-in-out infinite;
}
#g-rings{position:absolute;inset:0}
.g-ring{
  position:absolute;top:50%;left:50%;border-radius:50%;
  border:0.8px solid;transform:translate(-50%,-50%);
  animation:ringOut 5s ease-out forwards;
}
#g-stars{position:absolute;inset:0;overflow:hidden}
.g-star{position:absolute;border-radius:50%;animation:starRise linear infinite}
#g-cglow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(50,150,255,0.18),transparent 70%);
  animation:breathe 2.8s ease-in-out infinite;
}

/* ══════════════════════════════
   SUKUNA FX
══════════════════════════════ */
#sukuna-fx{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.1s}
body.sukuna-active #sukuna-fx{opacity:1}

#s-radial{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(200,20,0,0.22) 0%,rgba(140,10,0,0.12) 45%,transparent 70%);
  animation:breathe 2.4s ease-in-out infinite;
}
#s-cracks{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(70deg,transparent,transparent 47px,rgba(200,35,0,0.055) 48px),
    repeating-linear-gradient(140deg,transparent,transparent 47px,rgba(200,35,0,0.055) 48px);
}
#s-slashes{position:absolute;inset:0;overflow:hidden}
.slash{
  position:absolute;height:1.5px;width:130%;left:-15%;
  background:linear-gradient(90deg,transparent,rgba(255,45,0,.95) 25%,rgba(255,170,0,1) 50%,rgba(255,45,0,.95) 75%,transparent);
  box-shadow:0 0 10px rgba(255,55,0,.9),0 0 28px rgba(255,40,0,.5);
  transform-origin:center;animation:slashFly linear forwards;
}
#s-shrine{
  position:absolute;top:50%;left:50%;
  width:min(88vw,88vh);height:min(88vw,88vh);
  transform:translate(-50%,-50%);
  animation:shrineSpin 22s linear infinite;
}
#s-embers{position:absolute;inset:0;overflow:hidden}
.ember{position:absolute;border-radius:50%;animation:emberUp ease-out forwards}

/* ══════════════════════════════
   DOMAIN TEXT
══════════════════════════════ */
#domain-text{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:20;pointer-events:none;
  opacity:0;transition:opacity 1s 0.25s;
}
#domain-text.show{opacity:1}

#dt-kanji{
  font-family:'Noto Serif JP',serif;font-weight:700;
  font-size:clamp(3.2rem,9vw,8rem);letter-spacing:0.14em;line-height:1;
}
#dt-romaji{
  font-family:'Cinzel',serif;font-weight:400;
  font-size:clamp(0.6rem,1.4vw,1rem);letter-spacing:0.65em;
  margin-top:0.55rem;opacity:0.5;text-transform:uppercase;
}
#dt-name{
  font-family:'Cinzel',serif;font-weight:900;
  font-size:clamp(1.1rem,3.2vw,2.6rem);letter-spacing:0.38em;
  margin-top:0.75rem;text-transform:uppercase;
}

body.gojo-active   #dt-kanji{color:#e0f5ff;text-shadow:0 0 55px rgba(60,190,255,.95),0 0 110px rgba(50,110,255,.75),0 0 200px rgba(60,190,255,.35)}
body.gojo-active   #dt-romaji{color:rgba(130,215,255,.5)}
body.gojo-active   #dt-name  {color:#6de4ff;text-shadow:0 0 40px rgba(60,190,255,.85),0 0 80px rgba(50,130,255,.55)}
body.sukuna-active #dt-kanji {color:#fff4f0;text-shadow:0 0 55px rgba(255,55,0,.98),0 0 110px rgba(210,10,0,.85),0 0 200px rgba(255,40,0,.45)}
body.sukuna-active #dt-romaji{color:rgba(255,120,50,.5)}
body.sukuna-active #dt-name  {color:#ff5f28;text-shadow:0 0 40px rgba(255,55,0,.9),0 0 80px rgba(210,0,0,.75)}

/* ══════════════════════════════
   HUD
══════════════════════════════ */
#hud{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:1.8rem}
#hud-top{display:flex;justify-content:space-between;align-items:flex-start}
#hud-bot{display:flex;justify-content:center;gap:clamp(2.5rem,7vw,6rem);align-items:flex-end}

#logo{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.42em;color:rgba(255,255,255,0.18);text-transform:uppercase;line-height:1.8}

#pill{
  font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.22em;
  padding:7px 17px;border-radius:2px;
  border:0.5px solid rgba(255,255,255,0.1);
  background:rgba(0,0,0,0.55);color:rgba(255,255,255,0.28);
  transition:all 0.5s;backdrop-filter:blur(10px);
}
#pill.det  {color:rgba(255,255,255,.52);border-color:rgba(255,255,255,.18)}
#pill.cg   {color:rgba(60,190,255,.85);border-color:rgba(60,190,255,.35);background:rgba(0,25,65,.65);box-shadow:0 0 18px rgba(60,190,255,.12)}
#pill.cs   {color:rgba(255,85,25,.85); border-color:rgba(255,85,25,.35); background:rgba(65,10,0,.65); box-shadow:0 0 18px rgba(255,55,0,.12)}
#pill.ag   {color:#6de4ff;border-color:rgba(60,190,255,.65);background:rgba(0,35,85,.75);box-shadow:0 0 28px rgba(60,190,255,.22)}
#pill.as   {color:#ff5f28;border-color:rgba(255,75,20,.65);background:rgba(85,12,0,.75);box-shadow:0 0 28px rgba(255,55,0,.22)}

/* ── SIGN CARDS ── */
.card{display:flex;flex-direction:column;align-items:center;gap:9px;opacity:.38;transition:opacity .4s,transform .4s}
.card.lit   {opacity:.82;transform:translateY(-4px)}
.card.active{opacity:1;transform:translateY(-7px) scale(1.07)}

.card-box{
  width:72px;height:86px;border-radius:4px;border:0.5px solid;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;backdrop-filter:blur(6px);
}
.card-box::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.06),transparent)}

.g-card .card-box{border-color:rgba(60,190,255,.28);background:rgba(0,28,72,.58)}
.s-card .card-box{border-color:rgba(255,80,25,.28);background:rgba(72,10,0,.58)}

.card-lbl{font-family:'Cinzel',serif;font-size:0.52rem;font-weight:700;letter-spacing:0.24em;text-transform:uppercase}
.g-card .card-lbl{color:rgba(60,190,255,.62)}
.s-card .card-lbl{color:rgba(255,100,35,.62)}
.card-hint{font-size:0.48rem;letter-spacing:0.07em;color:rgba(255,255,255,.26);text-align:center;line-height:1.55;max-width:88px}

/* ── CHARGE BAR ── */
#chargebar{
  position:fixed;bottom:clamp(5.5rem,13vh,7.5rem);left:50%;transform:translateX(-50%);
  width:190px;z-index:30;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center;
}
#chargebar.show{opacity:1}
#cb-lbl{font-family:'Cinzel',serif;font-size:0.48rem;letter-spacing:0.28em;color:rgba(255,255,255,.32);margin-bottom:6px;text-transform:uppercase}
#cb-track{height:1.5px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
#cb-fill{height:100%;width:0%;border-radius:2px;transition:width .06s linear}
#chargebar.gc #cb-fill{background:linear-gradient(90deg,rgba(50,160,255,.9),rgba(140,225,255,1))}
#chargebar.sc #cb-fill{background:linear-gradient(90deg,rgba(255,55,0,.9),rgba(255,165,35,1))}

/* ── LOADER ── */
#loader{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;transition:opacity .9s}
#ld-jp{font-family:'Noto Serif JP',serif;font-weight:700;font-size:2rem;letter-spacing:.32em;color:rgba(255,255,255,.82)}
#ld-en{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.5em;color:rgba(255,255,255,.22);text-transform:uppercase}
#ld-msg{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.22em;color:rgba(255,255,255,.28)}
#ld-track{width:180px;height:1px;background:rgba(255,255,255,.08)}
#ld-prog{height:100%;width:0%;background:rgba(255,255,255,.5);transition:width .4s ease}

/* ── KEYFRAMES ── */
@keyframes gGrid   {0%{background-position:0 0,0 0}100%{background-position:80px 80px,80px 80px}}
@keyframes breathe {0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes ringOut {0%{width:0;height:0;opacity:.95}60%{opacity:.55}100%{width:min(115vw,115vh);height:min(115vw,115vh);opacity:0}}
@keyframes starRise{0%{transform:translateY(0) scale(1);opacity:var(--op)}100%{transform:translateY(-108vh) scale(0.15);opacity:0}}
@keyframes slashFly{0%{transform:rotate(var(--r)) scaleX(.08);opacity:1}100%{transform:rotate(var(--r)) scaleX(1);opacity:0}}
@keyframes shrineSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes emberUp  {0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),calc(-1*var(--dy))) scale(.18);opacity:0}}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div id="ld-jp">領域展開</div>
  <div id="ld-en">Domain Expansion</div>
  <div id="ld-msg">loading hand tracking…</div>
  <div id="ld-track"><div id="ld-prog"></div></div>
</div>

<video id="cam" autoplay playsinline muted></video>
<div id="vig"></div>
<canvas id="overlay"></canvas>

<!-- GOJO FX -->
<div id="gojo-fx">
  <div id="g-radial"></div>
  <div id="g-grid"></div>
  <div id="g-cglow"></div>
  <div id="g-rings"></div>
  <div id="g-stars"></div>
</div>

<!-- SUKUNA FX -->
<div id="sukuna-fx">
  <div id="s-radial"></div>
  <div id="s-cracks"></div>
  <div id="s-slashes"></div>
  <!-- Shrine seal SVG -->
  <svg id="s-shrine" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="250" cy="250" r="244" stroke="rgba(255,50,0,0.32)" stroke-width="0.9"/>
    <circle cx="250" cy="250" r="205" stroke="rgba(255,70,0,0.2)"  stroke-width="0.6"/>
    <circle cx="250" cy="250" r="155" stroke="rgba(255,55,0,0.26)" stroke-width="0.7"/>
    <circle cx="250" cy="250" r="95"  stroke="rgba(255,60,0,0.18)" stroke-width="0.5"/>
    <line x1="250" y1="6"   x2="250" y2="494" stroke="rgba(255,48,0,0.14)" stroke-width="0.5"/>
    <line x1="6"   y1="250" x2="494" y2="250" stroke="rgba(255,48,0,0.14)" stroke-width="0.5"/>
    <line x1="74"  y1="74"  x2="426" y2="426" stroke="rgba(255,48,0,0.09)" stroke-width="0.4"/>
    <line x1="426" y1="74"  x2="74"  y2="426" stroke="rgba(255,48,0,0.09)" stroke-width="0.4"/>
    <text x="250" y="30"  text-anchor="middle" fill="rgba(255,75,0,0.58)" font-size="20" font-family="serif">閻</text>
    <text x="250" y="487" text-anchor="middle" fill="rgba(255,75,0,0.58)" font-size="20" font-family="serif">魔</text>
    <text x="20"  y="257" text-anchor="middle" fill="rgba(255,75,0,0.58)" font-size="20" font-family="serif">天</text>
    <text x="480" y="257" text-anchor="middle" fill="rgba(255,75,0,0.58)" font-size="20" font-family="serif">印</text>
    <polygon points="250,208 262,242 298,242 270,262 281,296 250,276 219,296 230,262 202,242 238,242"
      fill="rgba(255,48,0,0.2)" stroke="rgba(255,95,0,0.52)" stroke-width="0.9"/>
    <circle cx="250" cy="250" r="28" fill="rgba(255,38,0,0.14)" stroke="rgba(255,80,0,0.42)" stroke-width="0.8"/>
  </svg>
  <div id="s-embers"></div>
</div>

<!-- DOMAIN TEXT -->
<div id="domain-text">
  <div id="dt-kanji"></div>
  <div id="dt-romaji">Ryōiki Tenkai</div>
  <div id="dt-name"></div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hud-top">
    <div id="logo">領域展開<br><span style="font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.35em;opacity:.6">DOMAIN EXPANSION</span></div>
    <div id="pill">initializing…</div>
  </div>
  <div id="hud-bot">

    <!-- SUKUNA CARD — prayer hands, both index up -->
    <div class="card s-card" id="card-s">
      <div class="card-box">
        <svg viewBox="0 0 60 78" width="46" height="60">
          <!-- LEFT hand -->
          <path d="M6 56 Q5 46 6 38 Q7 30 11 29 Q14 29 14 38 L14 54" fill="none" stroke="rgba(255,90,28,.52)" stroke-width="1.2" stroke-linecap="round"/>
          <!-- LEFT fingers curled (only index raised) -->
          <path d="M9 38 Q13 35 17 35" fill="none" stroke="rgba(255,80,20,.5)" stroke-width="1" stroke-linecap="round"/>
          <path d="M9 43 Q13 40 17 40" fill="none" stroke="rgba(255,80,20,.45)" stroke-width="1" stroke-linecap="round"/>
          <path d="M9 48 Q13 46 17 46" fill="none" stroke="rgba(255,80,20,.4)" stroke-width="1" stroke-linecap="round"/>
          <!-- LEFT index finger pointing UP -->
          <path d="M17 34 Q18 24 19 16 Q20 10 22 9 Q24 9 24 16 Q24 24 23 34"
            fill="none" stroke="rgba(255,125,38,.92)" stroke-width="1.55" stroke-linecap="round"/>
          <!-- RIGHT hand (mirror) -->
          <path d="M54 56 Q55 46 54 38 Q53 30 49 29 Q46 29 46 38 L46 54" fill="none" stroke="rgba(255,90,28,.52)" stroke-width="1.2" stroke-linecap="round"/>
          <!-- RIGHT fingers curled -->
          <path d="M51 38 Q47 35 43 35" fill="none" stroke="rgba(255,80,20,.5)" stroke-width="1" stroke-linecap="round"/>
          <path d="M51 43 Q47 40 43 40" fill="none" stroke="rgba(255,80,20,.45)" stroke-width="1" stroke-linecap="round"/>
          <path d="M51 48 Q47 46 43 46" fill="none" stroke="rgba(255,80,20,.4)" stroke-width="1" stroke-linecap="round"/>
          <!-- RIGHT index finger pointing UP -->
          <path d="M43 34 Q42 24 41 16 Q40 10 38 9 Q36 9 36 16 Q36 24 37 34"
            fill="none" stroke="rgba(255,125,38,.92)" stroke-width="1.55" stroke-linecap="round"/>
          <!-- Palms joined in center -->
          <path d="M14 38 Q20 36 30 36 Q40 36 46 38" fill="none" stroke="rgba(255,108,38,.78)" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M14 44 Q20 42 30 42 Q40 42 46 44" fill="none" stroke="rgba(255,100,32,.62)" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M14 50 Q20 49 30 49 Q40 49 46 50" fill="none" stroke="rgba(255,90,28,.5)" stroke-width="1.1" stroke-linecap="round"/>
          <!-- Thumbs tucked -->
          <path d="M11 54 Q9 60 11 67" fill="none" stroke="rgba(255,70,18,.42)" stroke-width="1" stroke-linecap="round"/>
          <path d="M49 54 Q51 60 49 67" fill="none" stroke="rgba(255,70,18,.42)" stroke-width="1" stroke-linecap="round"/>
          <!-- Glow between both index tips -->
          <circle cx="30" cy="10" r="5" fill="rgba(255,65,0,.3)"/>
          <circle cx="30" cy="10" r="2.2" fill="rgba(255,130,40,.72)"/>
          <!-- two index tips touching -->
          <line x1="24" y1="12" x2="36" y2="12" stroke="rgba(255,140,50,.55)" stroke-width=".9" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-lbl">Ryomen Sukuna</div>
      <div class="card-hint">Prayer hands · both<br>index fingers raised</div>
    </div>

    <!-- GOJO CARD — single index finger raised, one hand -->
    <div class="card g-card" id="card-g">
      <div class="card-box">
        <svg viewBox="0 0 44 78" width="34" height="60">
          <!-- Palm -->
          <ellipse cx="22" cy="58" rx="13" ry="11" fill="none" stroke="rgba(60,185,255,.48)" stroke-width="1.2"/>
          <!-- Wrist -->
          <line x1="13" y1="65" x2="11" y2="76" stroke="rgba(60,185,255,.38)" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="31" y1="65" x2="33" y2="76" stroke="rgba(60,185,255,.38)" stroke-width="1.2" stroke-linecap="round"/>
          <!-- MIDDLE finger — curled down -->
          <path d="M26 53 Q30 49 32 43 Q33 38 31 35 Q29 34 28 39 Q27 45 26 53"
            fill="none" stroke="rgba(50,160,255,.55)" stroke-width="1.1" stroke-linecap="round"/>
          <!-- RING finger — curled down -->
          <path d="M29 55 Q33 51 35 45 Q36 40 34 37 Q32 37 31 42 Q30 49 29 55"
            fill="none" stroke="rgba(50,155,255,.48)" stroke-width="1.1" stroke-linecap="round"/>
          <!-- PINKY — curled down -->
          <path d="M32 57 Q36 54 38 49 Q39 44 37 41 Q35 41 34 46 Q33 52 32 57"
            fill="none" stroke="rgba(50,150,255,.42)" stroke-width="1" stroke-linecap="round"/>
          <!-- THUMB — pressed across curled fingers -->
          <path d="M14 56 Q10 50 10 43 Q10 36 14 35 Q18 35 19 41 Q20 48 18 53"
            fill="none" stroke="rgba(55,165,255,.52)" stroke-width="1.1" stroke-linecap="round"/>
          <!-- INDEX finger — STRAIGHT UP (the main sign!) -->
          <path d="M19 50 Q18 38 18 26 Q18 14 20 10 Q22 7 24 10 Q26 14 25 26 Q24 38 23 50"
            fill="none" stroke="rgba(120,220,255,.98)" stroke-width="2" stroke-linecap="round"/>
          <!-- Tip glow -->
          <circle cx="22" cy="9" r="5.5" fill="rgba(60,185,255,.22)"/>
          <circle cx="22" cy="9" r="2.5" fill="rgba(160,240,255,.85)"/>
          <!-- Side glow on index -->
          <path d="M18 28 Q16 28 16 22 Q16 16 18 14" fill="none" stroke="rgba(80,200,255,.2)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-lbl">Gojo Satoru</div>
      <div class="card-hint">One hand · single<br>index finger up</div>
    </div>

  </div>
</div>

<!-- CHARGE BAR -->
<div id="chargebar">
  <div id="cb-lbl">charging domain</div>
  <div id="cb-track"><div id="cb-fill"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
<script>
/* ═══════════════════════════════════════
   ELEMENTS
═══════════════════════════════════════ */
const video    = document.getElementById('cam');
const overlay  = document.getElementById('overlay');
const ctx      = overlay.getContext('2d');
const pill     = document.getElementById('pill');
const loader   = document.getElementById('loader');
const ldProg   = document.getElementById('ld-prog');
const ldMsg    = document.getElementById('ld-msg');
const domText  = document.getElementById('domain-text');
const dtKanji  = document.getElementById('dt-kanji');
const dtName   = document.getElementById('dt-name');
const chargeEl = document.getElementById('chargebar');
const cbFill   = document.getElementById('cb-fill');
const cardG    = document.getElementById('card-g');
const cardS    = document.getElementById('card-s');

function resize(){ overlay.width=window.innerWidth; overlay.height=window.innerHeight; }
resize(); window.addEventListener('resize',resize);

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let domain   = null;   // 'gojo' | 'sukuna' | null
let lastGest = null;
let holdStart= null;
let chargeIv = null;
let fxIvs    = [];
const HOLD   = 1600;   // ms to hold sign before activation

/* ═══════════════════════════════════════
   AURA PALETTES
═══════════════════════════════════════ */
const PAL = {
  none:  {a:'rgba(170,205,255,',b:'rgba(130,175,255,',c:'rgba(210,230,255,',glow:9, bone:1.4},
  gojo:  {a:'rgba(50,175,255,', b:'rgba(70,115,255,', c:'rgba(155,228,255,',glow:30,bone:3},
  sukuna:{a:'rgba(255,62,8,',   b:'rgba(255,138,18,', c:'rgba(255,28,0,',   glow:30,bone:3}
};

/* ═══════════════════════════════════════
   GESTURE CLASSIFICATION

   Gojo   : ONLY index up, ALL others curled → one-finger point
   Sukuna : index + middle up, ring + pinky down → two-finger point / prayer
   Open   : all 4 up → dismiss
═══════════════════════════════════════ */
function classify(L){
  if(!L||L.length<21) return null;
  const up =(t,p)=>L[t].y < L[p].y - 0.028;
  const dn =(t,p)=>L[t].y > L[p].y + 0.012;

  const iUp=up(8,6), mUp=up(12,10), rUp=up(16,14), pUp=up(20,18);

  if( iUp && !mUp && !rUp && !pUp) return 'gojo';
  if( iUp &&  mUp && !rUp && !pUp) return 'sukuna';
  if( iUp &&  mUp &&  rUp &&  pUp) return 'open';
  return null;
}

/* ═══════════════════════════════════════
   DOMAIN ON / OFF
═══════════════════════════════════════ */
function activate(d){
  if(domain===d) return;
  deactivate(true);
  domain=d;
  document.body.classList.add(d+'-active');

  if(d==='gojo'){
    dtKanji.textContent='無量空処';
    dtName.textContent='INFINITE VOID';
    pill.className='ag'; pill.textContent='無量空処 · ACTIVE';
    cardG.className='card g-card active';
    spawnRings(); spawnStars();
  } else {
    dtKanji.textContent='伏魔御廚子';
    dtName.textContent='MALEVOLENT SHRINE';
    pill.className='as'; pill.textContent='伏魔御廚子 · ACTIVE';
    cardS.className='card s-card active';
    startSlashes(); startEmbers();
  }
  domText.classList.add('show');
}

function deactivate(keep){
  if(!domain) return;
  document.body.classList.remove(domain+'-active');
  domText.classList.remove('show');
  cardG.className='card g-card';
  cardS.className='card s-card';
  stopSlashes(); stopEmbers();
  document.getElementById('g-rings').innerHTML='';
  document.getElementById('g-stars').innerHTML='';
  fxIvs.forEach(x=>clearInterval(x)); fxIvs=[];
  if(!keep) domain=null;
}

/* ═══════════════════════════════════════
   GOJO FX
═══════════════════════════════════════ */
function spawnRings(){
  const c=document.getElementById('g-rings');
  c.innerHTML='';
  const cols=['rgba(55,185,255,.62)','rgba(75,130,255,.46)','rgba(145,225,255,.36)','rgba(185,245,255,.22)'];
  cols.forEach((col,i)=>{
    setTimeout(()=>{
      const r=document.createElement('div'); r.className='g-ring';
      r.style.cssText=`border-color:${col};animation-duration:${4.8+i*.5}s`;
      c.appendChild(r);
    },i*380);
  });
  const iv=setInterval(()=>{
    if(!document.body.classList.contains('gojo-active')){clearInterval(iv);return;}
    const r=document.createElement('div'); r.className='g-ring';
    r.style.cssText=`border-color:rgba(75,180,255,.28);animation-duration:5.2s`;
    c.appendChild(r); setTimeout(()=>r.remove(),5500);
  },2600);
  fxIvs.push(iv);
}

function spawnStars(){
  const c=document.getElementById('g-stars'); c.innerHTML='';
  for(let i=0;i<95;i++){
    const s=document.createElement('div'); s.className='g-star';
    const sz=0.35+Math.random()*2.6, op=0.3+Math.random()*.85;
    const dur=4.5+Math.random()*11, del=Math.random()*9;
    const r=150+Math.random()*105, g2=190+Math.random()*65;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${55+Math.random()*55}%;
      background:rgba(${r},${g2},255,${op});--op:${op};
      animation-duration:${dur}s;animation-delay:${del}s`;
    c.appendChild(s);
  }
}

/* ═══════════════════════════════════════
   SUKUNA FX
═══════════════════════════════════════ */
let slashIv=null;
function startSlashes(){
  const c=document.getElementById('s-slashes');
  function add(){
    if(!document.body.classList.contains('sukuna-active')) return;
    const s=document.createElement('div'); s.className='slash';
    const t=5+Math.random()*90, r=(Math.random()-.5)*48, d=.16+Math.random()*.18;
    s.style.cssText=`top:${t}%;--r:${r}deg;animation-duration:${d}s`;
    c.appendChild(s); setTimeout(()=>s.remove(),(d+.12)*1000);
  }
  add(); slashIv=setInterval(add,210);
}
function stopSlashes(){clearInterval(slashIv); document.getElementById('s-slashes').innerHTML='';}

let emberIv=null;
function startEmbers(){
  const c=document.getElementById('s-embers'); c.innerHTML='';
  function add(){
    if(!document.body.classList.contains('sukuna-active')) return;
    const e=document.createElement('div'); e.className='ember';
    const sz=1.4+Math.random()*4.2, dur=1.1+Math.random()*2;
    const dx=(Math.random()-.5)*72, dy=55+Math.random()*55;
    const ri=80+Math.floor(Math.random()*65), gi=15+Math.floor(Math.random()*85);
    e.style.cssText=`width:${sz}px;height:${sz}px;left:${8+Math.random()*84}%;bottom:${Math.random()*28}%;
      background:rgba(${ri},${gi},0,.96);--dx:${dx}px;--dy:${dy}px;
      animation-duration:${dur}s;box-shadow:0 0 ${sz*2.2}px rgba(255,75,0,.65)`;
    c.appendChild(e); setTimeout(()=>e.remove(),(dur+.12)*1000);
  }
  for(let i=0;i<28;i++) setTimeout(add,i*75);
  emberIv=setInterval(()=>{for(let i=0;i<5;i++) add();},170);
}
function stopEmbers(){clearInterval(emberIv); document.getElementById('s-embers').innerHTML='';}

/* ═══════════════════════════════════════
   CHARGE BAR
═══════════════════════════════════════ */
function startCharge(type){
  chargeEl.className='show '+(type==='gojo'?'gc':'sc');
  cbFill.style.width='0%'; holdStart=Date.now();
  clearInterval(chargeIv);
  chargeIv=setInterval(()=>{
    const pct=Math.min(100,((Date.now()-holdStart)/HOLD)*100);
    cbFill.style.width=pct+'%';
    if(pct>=100){clearInterval(chargeIv); chargeEl.className=''; activate(type);}
  },28);
}
function stopCharge(){clearInterval(chargeIv); chargeEl.className=''; holdStart=null;}

/* ═══════════════════════════════════════
   AURA RENDERING
═══════════════════════════════════════ */
const BONES=[
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

function drawAura(lms,t){
  if(!lms) return;
  const W=overlay.width, H=overlay.height;
  const pal=PAL[domain||'none'];
  const pts=lms.map(l=>({x:l.x*W, y:l.y*H}));
  const pulse=0.58+0.42*Math.sin(t*0.0033);

  ctx.save();
  ctx.scale(-1,1); ctx.translate(-W,0);

  // Pass 1 — wide outer glow
  ctx.lineWidth=pal.glow; ctx.lineCap='round';
  for(const [a,b] of BONES){
    ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y);
    ctx.strokeStyle=pal.a+'0.1)'; ctx.stroke();
  }
  // Pass 2 — mid glow
  ctx.lineWidth=pal.glow*.4;
  for(const [a,b] of BONES){
    ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y);
    ctx.strokeStyle=pal.b+'0.2)'; ctx.stroke();
  }
  // Pass 3 — core line with gradient
  ctx.lineWidth=pal.bone;
  for(const [a,b] of BONES){
    const g=ctx.createLinearGradient(pts[a].x,pts[a].y,pts[b].x,pts[b].y);
    g.addColorStop(0,pal.a+(pulse*.95)+')');
    g.addColorStop(.5,pal.c+(pulse*.88)+')');
    g.addColorStop(1,pal.a+(pulse*.95)+')');
    ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y);
    ctx.strokeStyle=g; ctx.stroke();
  }

  // Joints
  const joints=domain?[0,4,5,8,9,12,13,16,17,20]:[0,8];
  for(const i of joints){
    const p=pts[i], br=(i===0?12:7)*pulse;
    const h=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,br*3);
    h.addColorStop(0,pal.a+'0.58)'); h.addColorStop(.55,pal.a+'0.14)'); h.addColorStop(1,pal.a+'0)');
    ctx.beginPath(); ctx.arc(p.x,p.y,br*3,0,Math.PI*2); ctx.fillStyle=h; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x,p.y,br*.42,0,Math.PI*2); ctx.fillStyle=pal.c+'0.98)'; ctx.fill();
  }

  // Orbital particles when domain is active
  if(domain){
    const px=(pts[0].x+pts[9].x)/2, py=(pts[0].y+pts[9].y)/2;
    const N=domain==='gojo'?10:7;
    const spd=domain==='gojo'?1:-1.5;
    for(let i=0;i<N;i++){
      const ang=t*.0022*spd+i*(Math.PI*2/N);
      const dist=52+24*Math.sin(t*.003+i*1.15);
      const ox=px+Math.cos(ang)*dist, oy=py+Math.sin(ang)*dist;
      const pr=2.2+1.9*Math.sin(t*.005+i*2.1);
      ctx.beginPath(); ctx.arc(ox,oy,pr,0,Math.PI*2);
      ctx.fillStyle=pal.b+(0.52+0.44*Math.sin(t*.004+i))+')'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ox,oy);
      ctx.strokeStyle=pal.a+'0.06)'; ctx.lineWidth=.8; ctx.stroke();
    }
    // Palm ripple
    const rr=68+32*Math.sin(t*.0019);
    const rg=ctx.createRadialGradient(px,py,rr*.48,px,py,rr);
    rg.addColorStop(0,pal.a+'0)'); rg.addColorStop(.68,pal.a+'0.13)'); rg.addColorStop(1,pal.a+'0)');
    ctx.beginPath(); ctx.arc(px,py,rr,0,Math.PI*2); ctx.fillStyle=rg; ctx.fill();

    // Fingertip sparks
    for(const tipIdx of [4,8,12,16,20]){
      const tp=pts[tipIdx];
      const sr=3+2*Math.sin(t*.006+tipIdx);
      const sg=ctx.createRadialGradient(tp.x,tp.y,0,tp.x,tp.y,sr*2.5);
      sg.addColorStop(0,pal.c+'.7)'); sg.addColorStop(1,pal.a+'0)');
      ctx.beginPath(); ctx.arc(tp.x,tp.y,sr*2.5,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
      ctx.beginPath(); ctx.arc(tp.x,tp.y,sr*.35,0,Math.PI*2); ctx.fillStyle=pal.c+'.95)'; ctx.fill();
    }
  }

  ctx.restore();
}

/* ═══════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════ */
let mpData=null;
function loop(ts){
  ctx.clearRect(0,0,overlay.width,overlay.height);
  const lms=mpData?.multiHandLandmarks?.[0]||null;

  if(lms){
    drawAura(lms,ts);
    const g=classify(lms);

    if(g!==lastGest){
      lastGest=g; stopCharge();
      if(!domain){
        cardG.className='card g-card'; cardS.className='card s-card';
        if(g==='gojo'){
          pill.className='cg'; pill.textContent='Gojo sign — hold…';
          cardG.className='card g-card lit'; startCharge('gojo');
        } else if(g==='sukuna'){
          pill.className='cs'; pill.textContent='Sukuna sign — hold…';
          cardS.className='card s-card lit'; startCharge('sukuna');
        } else {
          pill.className='det'; pill.textContent='show your hand sign';
        }
      } else {
        // dismiss on open palm or no gesture
        if(g==='open'||g===null){
          deactivate(false);
          pill.className='det'; pill.textContent='show your hand sign';
        }
      }
    }
  } else {
    if(lastGest){
      lastGest=null; stopCharge();
      cardG.className='card g-card'; cardS.className='card s-card';
      if(domain){ deactivate(false); }
      if(mpData){ pill.className='det'; pill.textContent='show your hand'; }
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═══════════════════════════════════════
   MEDIAPIPE
═══════════════════════════════════════ */
ldProg.style.width='15%';
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.72,minTrackingConfidence:.66});
hands.onResults(r=>{
  mpData=r;
  if(loader.style.opacity!=='0'){
    ldProg.style.width='100%'; ldMsg.textContent='ready';
    setTimeout(()=>{
      loader.style.opacity='0';
      setTimeout(()=>loader.style.display='none',950);
      pill.className='det'; pill.textContent='show your hand sign';
    },500);
  }
});

ldProg.style.width='48%'; ldMsg.textContent='starting camera…';
const camera=new Camera(video,{
  onFrame:async()=>await hands.send({image:video}),
  width:1280,height:720
});
camera.start()
  .then(()=>{ ldProg.style.width='82%'; ldMsg.textContent='loading model…'; })
  .catch(e=>{ ldMsg.textContent='camera error: '+e.message; ldProg.style.background='#f43'; });
</script>
