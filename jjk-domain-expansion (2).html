<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>領域展開 · JJK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+JP:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}

#cam{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;transform:scaleX(-1);z-index:1;
  filter:saturate(0.5) brightness(0.55) contrast(1.1);
  transition:filter 1.5s ease;
}
body.gojo-active   #cam{filter:saturate(0.05) brightness(0.16) contrast(1.6) hue-rotate(215deg)}
body.sukuna-active #cam{filter:saturate(0.06) brightness(0.13) contrast(1.7) sepia(0.9)}
body.red-active    #cam{filter:saturate(0.15) brightness(0.3)  contrast(1.4) hue-rotate(-15deg)}
body.purple-active #cam{filter:saturate(0.1)  brightness(0.2)  contrast(1.5) hue-rotate(275deg)}

#overlay{position:fixed;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none;z-index:8}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 15%,rgba(0,0,0,0.9) 100%)}

/* ══ GOJO — deep space void ══ */
#gojo-fx{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.5s}
body.gojo-active #gojo-fx{opacity:1}

#g-space{position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(4,6,28,0.97) 0%,rgba(1,2,12,0.99) 60%,#000 100%)}

#g-galaxy{position:absolute;top:50%;left:50%;
  width:min(140vw,140vh);height:min(140vw,140vh);
  transform:translate(-50%,-50%);border-radius:50%;
  background:
    radial-gradient(ellipse 85% 18% at 50% 50%,rgba(50,70,190,0.1) 0%,transparent 100%),
    radial-gradient(ellipse 18% 85% at 50% 50%,rgba(70,40,170,0.07) 0%,transparent 100%),
    radial-gradient(ellipse 60% 10% at 30% 60%,rgba(40,60,160,0.08) 0%,transparent 100%);
  animation:galaxySpin 50s linear infinite}

#g-blackhole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(16vw,16vh);height:min(16vw,16vh);border-radius:50%;
  background:radial-gradient(circle,#000 0%,#000 45%,rgba(8,18,80,0.5) 65%,transparent 100%);
  box-shadow:0 0 min(5vw,5vh) min(1.5vw,1.5vh) rgba(25,55,210,0.28),
             0 0 min(12vw,12vh) min(4vw,4vh) rgba(15,35,170,0.14),
             0 0 min(28vw,28vh) min(9vw,9vh) rgba(8,18,100,0.07);
  animation:bhPulse 4s ease-in-out infinite}

#g-disk{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotateX(74deg);
  width:min(40vw,40vh);height:min(40vw,40vh);border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 50%,
      transparent 40%,rgba(35,95,255,0.38) 46%,
      rgba(70,130,255,0.28) 53%,rgba(110,175,255,0.18) 62%,
      rgba(160,200,255,0.08) 72%,transparent 82%);
  animation:diskSpin 7s linear infinite}

#g-nebula{position:absolute;inset:0;overflow:hidden}
.nebpatch{position:absolute;border-radius:50%;filter:blur(35px);animation:nebDrift ease-in-out infinite alternate}
#g-stars{position:absolute;inset:0;overflow:hidden}
.gstar{position:absolute;border-radius:50%;animation:starTwink ease-in-out infinite alternate}

/* Infinite information scan lines */
#g-scanlines{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 2s 0.5s}
body.gojo-active #g-scanlines{opacity:0.35}
.scanline{position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(90,140,255,0.12),rgba(180,215,255,0.28),rgba(90,140,255,0.12),transparent);
  animation:scanScroll linear infinite}

/* Gravitational lensing rings around black hole */
#g-lensrings{position:absolute;inset:0}
.lensring{position:absolute;top:50%;left:50%;border-radius:50%;
  border:0.5px solid;transform:translate(-50%,-50%);
  animation:lensPulse ease-in-out infinite}

/* ══ SUKUNA — demonic shrine ══ */
#sukuna-fx{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.5s}
body.sukuna-active #sukuna-fx{opacity:1}

#s-ground{position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 90%,rgba(80,18,0,0.85) 0%,rgba(30,5,0,0.94) 45%,rgba(3,0,0,0.98) 100%)}

#s-water{position:absolute;bottom:0;left:0;right:0;height:32%;
  background:linear-gradient(to bottom,rgba(45,10,0,0.4),rgba(15,3,0,0.88));
  border-top:1px solid rgba(160,45,0,0.22);overflow:hidden}
#s-water::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(200,55,0,0.04) 40px);
  animation:waterFlow 5s linear infinite}
#s-water::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(220,60,0,0.25),transparent);
  animation:waterShine 3s ease-in-out infinite}

/* Shrine SVG container */
#s-shrine-wrap{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);
  width:min(72vw,65vh);opacity:0.92}

/* atmospheric dark red fog */
#s-fog{position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 25% 50%,rgba(160,18,0,0.14),transparent 55%),
    radial-gradient(ellipse at 75% 45%,rgba(130,10,0,0.11),transparent 55%),
    radial-gradient(ellipse at 50% 80%,rgba(180,25,0,0.18),transparent 50%);
  animation:fogPulse 3.5s ease-in-out infinite}

#s-slashes{position:absolute;inset:0;overflow:hidden}
.sslash{position:absolute;height:1px;width:140%;left:-20%;
  background:linear-gradient(90deg,transparent,rgba(255,48,0,0) 8%,rgba(255,75,0,0.92) 28%,rgba(255,210,110,1) 50%,rgba(255,75,0,0.92) 72%,rgba(255,48,0,0) 92%,transparent);
  box-shadow:0 0 8px rgba(255,65,0,0.85),0 0 22px rgba(255,45,0,0.45);
  transform-origin:center;animation:slashFly linear forwards}

#s-embers{position:absolute;inset:0;overflow:hidden}
.ember{position:absolute;border-radius:50%;animation:emberUp ease-out forwards}

#s-skulls{position:absolute;inset:0;overflow:hidden}
.skull{position:absolute;font-size:clamp(0.9rem,2.5vw,2rem);
  filter:brightness(0.35) sepia(1) hue-rotate(-15deg);
  animation:skullDrift ease-in-out forwards;opacity:0}

/* ══ REVERSAL RED ══ */
#red-fx{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 0.7s}
body.red-active #red-fx{opacity:1}

#red-bg{position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,28,0,0.28) 0%,rgba(180,8,0,0.16) 40%,rgba(90,0,0,0.1) 70%,transparent 100%);
  animation:redBreath 1.1s ease-in-out infinite}

#red-orb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(14vw,14vh);height:min(14vw,14vh);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,220,1) 0%,rgba(255,120,0,0.92) 28%,rgba(255,35,0,0.65) 56%,transparent 80%);
  box-shadow:0 0 min(5vw,5vh) rgba(255,80,0,0.95),0 0 min(10vw,10vh) rgba(255,40,0,0.65),
             0 0 min(20vw,20vh) rgba(210,0,0,0.42),0 0 min(38vw,38vh) rgba(150,0,0,0.18);
  animation:redOrbPulse 0.75s ease-in-out infinite}

#red-rings{position:absolute;inset:0}
.redring{position:absolute;top:50%;left:50%;border-radius:50%;
  border:1.2px solid rgba(255,55,0,0.7);transform:translate(-50%,-50%);
  box-shadow:0 0 12px rgba(255,40,0,0.45),inset 0 0 8px rgba(255,20,0,0.2);
  animation:redRingOut ease-out forwards}

#red-sparks{position:absolute;inset:0;overflow:hidden}
.redspark{position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,220,80,0.95),rgba(255,70,0,0.7),transparent 70%);
  animation:sparkBlast ease-out forwards}

/* ══ HOLLOW PURPLE ══ */
#purple-fx{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 0.6s}
body.purple-active #purple-fx{opacity:1}

#purple-bg{position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(145,0,210,0.32) 0%,rgba(85,0,150,0.2) 38%,rgba(28,0,55,0.14) 68%,transparent 100%);
  animation:purpleBreath 1.4s ease-in-out infinite}

/* Blue + Red orbs converging */
#p-blue-orb{position:absolute;top:42%;left:36%;transform:translate(-50%,-50%);
  width:min(10vw,10vh);height:min(10vw,10vh);border-radius:50%;
  background:radial-gradient(circle,rgba(210,235,255,1),rgba(45,145,255,0.88),rgba(0,75,255,0.4),transparent 78%);
  box-shadow:0 0 min(5vw,5vh) rgba(40,145,255,0.95),0 0 min(12vw,12vh) rgba(0,80,255,0.55);
  animation:blueOrbIn 0.9s ease-in forwards}

#p-red-orb{position:absolute;top:58%;left:64%;transform:translate(-50%,-50%);
  width:min(10vw,10vh);height:min(10vw,10vh);border-radius:50%;
  background:radial-gradient(circle,rgba(255,235,210,1),rgba(255,100,0,0.88),rgba(255,28,0,0.4),transparent 78%);
  box-shadow:0 0 min(5vw,5vh) rgba(255,78,0,0.95),0 0 min(12vw,12vh) rgba(200,0,0,0.55);
  animation:redOrbIn 0.9s ease-in forwards}

#p-main{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(22vw,22vh);height:min(22vw,22vh);border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,255,255,1) 0%,rgba(210,105,255,0.96) 18%,
    rgba(148,0,228,0.88) 42%,rgba(85,0,165,0.55) 62%,transparent 82%);
  box-shadow:
    0 0 min(7vw,7vh) rgba(185,0,255,0.95),0 0 min(16vw,16vh) rgba(130,0,210,0.65),
    0 0 min(32vw,32vh) rgba(80,0,160,0.38),0 0 min(58vw,58vh) rgba(55,0,120,0.16);
  opacity:0;transition:opacity 0.55s 0.55s;animation:purpleOrbPulse 1s ease-in-out infinite}
body.purple-active #p-main{opacity:1}

#p-beams{position:absolute;inset:0;overflow:hidden}
.pbeam{position:absolute;top:50%;left:50%;height:2px;
  transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(190,0,255,0.85),rgba(220,80,255,0.4),transparent);
  animation:beamOut ease-out forwards}

#p-shockwave{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid rgba(185,0,255,0.85);width:0;height:0;
  box-shadow:0 0 22px rgba(185,0,255,0.65);
  animation:shockOut 1.8s ease-out infinite 0.7s}

/* ══ DOMAIN TEXT ══ */
#domain-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:20;pointer-events:none;
  opacity:0;transition:opacity 1.1s 0.25s}
#domain-text.show{opacity:1}

#dt-kanji{font-family:'Noto Serif JP',serif;font-weight:700;
  font-size:clamp(2.6rem,8vw,7rem);letter-spacing:0.13em;line-height:1}
#dt-romaji{font-family:'Cinzel',serif;font-size:clamp(0.5rem,1.2vw,0.95rem);
  letter-spacing:0.7em;margin-top:0.5rem;opacity:0.48;text-transform:uppercase}
#dt-name{font-family:'Cinzel',serif;font-weight:900;
  font-size:clamp(0.95rem,2.8vw,2.4rem);letter-spacing:0.4em;
  margin-top:0.65rem;text-transform:uppercase}

body.gojo-active   #dt-kanji{color:#d5eeff;text-shadow:0 0 55px rgba(45,175,255,.98),0 0 110px rgba(30,95,255,.78),0 0 220px rgba(45,175,255,.32)}
body.gojo-active   #dt-romaji{color:rgba(110,205,255,.48)}
body.gojo-active   #dt-name  {color:#52d8ff;text-shadow:0 0 38px rgba(45,180,255,.88),0 0 76px rgba(30,115,255,.58)}
body.sukuna-active #dt-kanji {color:#fff0ec;text-shadow:0 0 55px rgba(255,50,0,.99),0 0 110px rgba(205,8,0,.88),0 0 220px rgba(255,35,0,.42)}
body.sukuna-active #dt-romaji{color:rgba(255,112,42,.48)}
body.sukuna-active #dt-name  {color:#ff4e18;text-shadow:0 0 38px rgba(255,50,0,.92),0 0 76px rgba(195,0,0,.72)}
body.red-active    #dt-kanji {color:#fff2ec;text-shadow:0 0 45px rgba(255,75,0,1),0 0 90px rgba(255,35,0,.85),0 0 180px rgba(195,0,0,.52)}
body.red-active    #dt-romaji{color:rgba(255,132,52,.5)}
body.red-active    #dt-name  {color:#ff6825;text-shadow:0 0 32px rgba(255,75,0,.92)}
body.purple-active #dt-kanji {color:#f3e5ff;text-shadow:0 0 55px rgba(185,0,255,.98),0 0 110px rgba(120,0,205,.78),0 0 220px rgba(185,0,255,.38)}
body.purple-active #dt-romaji{color:rgba(200,92,255,.52)}
body.purple-active #dt-name  {color:#cc55ff;text-shadow:0 0 38px rgba(185,0,255,.92),0 0 76px rgba(115,0,200,.62)}

/* ══ HUD ══ */
#hud{position:fixed;inset:0;z-index:30;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;padding:1.6rem}
#hud-top{display:flex;justify-content:space-between;align-items:flex-start}
#hud-bot{display:flex;justify-content:center;gap:clamp(0.8rem,2.5vw,2.2rem);align-items:flex-end}

#logo{font-family:'Cinzel',serif;font-size:0.56rem;letter-spacing:0.46em;
  color:rgba(255,255,255,0.16);text-transform:uppercase;line-height:2}

#pill{font-family:'Cinzel',serif;font-size:0.56rem;letter-spacing:0.22em;
  padding:7px 16px;border-radius:2px;border:0.5px solid rgba(255,255,255,0.1);
  background:rgba(0,0,0,0.58);color:rgba(255,255,255,0.26);
  transition:all 0.5s;backdrop-filter:blur(10px)}
#pill.det{color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.18)}
#pill.cg {color:rgba(45,178,255,.84);border-color:rgba(45,178,255,.3);background:rgba(0,20,58,.68)}
#pill.cs {color:rgba(255,80,18,.84); border-color:rgba(255,80,18,.3); background:rgba(58,8,0,.68)}
#pill.cr {color:rgba(255,105,35,.84);border-color:rgba(255,78,18,.3);background:rgba(65,10,0,.62)}
#pill.cp {color:rgba(188,52,255,.84);border-color:rgba(155,25,255,.3);background:rgba(38,0,78,.68)}
#pill.ag {color:#52d8ff;border-color:rgba(45,178,255,.68);background:rgba(0,28,75,.82);box-shadow:0 0 28px rgba(45,178,255,.22)}
#pill.as {color:#ff4e18;border-color:rgba(255,62,15,.68);background:rgba(75,10,0,.82);box-shadow:0 0 28px rgba(255,48,0,.22)}
#pill.ar {color:#ff6825;border-color:rgba(255,75,18,.68);background:rgba(68,10,0,.82);box-shadow:0 0 28px rgba(255,58,0,.2)}
#pill.ap {color:#cc55ff;border-color:rgba(165,25,255,.68);background:rgba(46,0,95,.82);box-shadow:0 0 28px rgba(165,0,255,.22)}

/* ── SIGN CARDS ── */
.card{display:flex;flex-direction:column;align-items:center;gap:7px;
  opacity:.32;transition:opacity .4s,transform .4s}
.card.lit   {opacity:.78;transform:translateY(-4px)}
.card.active{opacity:1;transform:translateY(-7px) scale(1.08)}

.cbox{width:66px;height:82px;border-radius:4px;border:0.5px solid;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;backdrop-filter:blur(6px)}
.cbox::before{content:'';position:absolute;inset:0;
  background:linear-gradient(140deg,rgba(255,255,255,.055),transparent)}

.gc .cbox{border-color:rgba(45,178,255,.26);background:rgba(0,22,65,.6)}
.sc .cbox{border-color:rgba(255,75,16,.26);background:rgba(65,9,0,.6)}
.rc .cbox{border-color:rgba(255,88,18,.3); background:rgba(75,12,0,.56)}
.pc .cbox{border-color:rgba(162,22,255,.26);background:rgba(46,0,88,.58)}

.clbl{font-family:'Cinzel',serif;font-size:0.46rem;font-weight:700;letter-spacing:0.24em;text-transform:uppercase}
.gc .clbl{color:rgba(45,178,255,.62)} .sc .clbl{color:rgba(255,92,28,.62)}
.rc .clbl{color:rgba(255,108,38,.62)} .pc .clbl{color:rgba(178,52,255,.62)}
.chint{font-size:0.42rem;letter-spacing:0.06em;color:rgba(255,255,255,.24);text-align:center;line-height:1.55;max-width:80px}

/* ── CHARGE BAR ── */
#cbar{position:fixed;bottom:clamp(5rem,11.5vh,6.8rem);left:50%;transform:translateX(-50%);
  width:195px;z-index:30;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
#cbar.show{opacity:1}
#cb-l{font-family:'Cinzel',serif;font-size:0.44rem;letter-spacing:0.3em;
  color:rgba(255,255,255,.3);margin-bottom:6px;text-transform:uppercase}
#cb-t{height:1.5px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
#cb-f{height:100%;width:0%;border-radius:2px;transition:width .06s linear}
#cbar.gc #cb-f{background:linear-gradient(90deg,rgba(40,150,255,.9),rgba(135,218,255,1))}
#cbar.sc #cb-f{background:linear-gradient(90deg,rgba(255,50,0,.9),rgba(255,155,32,1))}
#cbar.rc #cb-f{background:linear-gradient(90deg,rgba(255,65,0,.9),rgba(255,148,45,1))}
#cbar.pc #cb-f{background:linear-gradient(90deg,rgba(135,0,218,.9),rgba(205,75,255,1))}

/* ── LOADER ── */
#loader{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.8rem;transition:opacity .9s}
#ld-jp{font-family:'Noto Serif JP',serif;font-weight:700;font-size:2rem;letter-spacing:.34em;color:rgba(255,255,255,.82)}
#ld-en{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.52em;color:rgba(255,255,255,.2);text-transform:uppercase}
#ld-msg{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.24em;color:rgba(255,255,255,.28)}
#ld-bar{width:180px;height:1px;background:rgba(255,255,255,.07)}
#ld-prog{height:100%;width:0%;background:rgba(255,255,255,.5);transition:width .4s}

/* ══ KEYFRAMES ══ */
@keyframes galaxySpin {from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes bhPulse    {0%,100%{box-shadow:0 0 min(5vw,5vh) min(1.5vw,1.5vh) rgba(25,55,210,.28),0 0 min(12vw,12vh) min(4vw,4vh) rgba(15,35,170,.14),0 0 min(28vw,28vh) min(9vw,9vh) rgba(8,18,100,.07)}50%{box-shadow:0 0 min(7vw,7vh) min(2.5vw,2.5vh) rgba(38,78,255,.38),0 0 min(16vw,16vh) min(5vw,5vh) rgba(28,58,200,.18),0 0 min(32vw,32vh) min(10vw,10vh) rgba(14,28,130,.09)}}
@keyframes diskSpin   {from{transform:translate(-50%,-50%) rotateX(74deg) rotate(0)}to{transform:translate(-50%,-50%) rotateX(74deg) rotate(360deg)}}
@keyframes nebDrift   {0%{transform:translate(0,0) scale(1)}100%{transform:translate(25px,-18px) scale(1.12)}}
@keyframes starTwink  {0%{opacity:var(--oa)}100%{opacity:var(--ob)}}
@keyframes scanScroll {0%{transform:translateY(-100px);opacity:0}8%{opacity:1}92%{opacity:0.8}100%{transform:translateY(100vh);opacity:0}}
@keyframes lensPulse  {0%,100%{opacity:0.3;transform:translate(-50%,-50%) scale(1)}50%{opacity:0.6;transform:translate(-50%,-50%) scale(1.03)}}
@keyframes fogPulse   {0%,100%{opacity:.7}50%{opacity:1}}
@keyframes waterFlow  {0%{background-position:0 0}100%{background-position:40px 0}}
@keyframes waterShine {0%,100%{opacity:.4}50%{opacity:.9}}
@keyframes slashFly   {0%{transform:rotate(var(--r)) scaleX(.04);opacity:1}100%{transform:rotate(var(--r)) scaleX(1);opacity:0}}
@keyframes emberUp    {0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),calc(-1*var(--dy))) scale(.15);opacity:0}}
@keyframes skullDrift {0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.35}85%{opacity:.18}100%{transform:translateY(-90px) rotate(var(--r));opacity:0}}
@keyframes redBreath  {0%,100%{opacity:.82}50%{opacity:1}}
@keyframes redOrbPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.18)}}
@keyframes redRingOut {0%{width:0;height:0;opacity:.95}100%{width:min(95vw,95vh);height:min(95vw,95vh);opacity:0}}
@keyframes sparkBlast {0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
@keyframes purpleBreath{0%,100%{opacity:.82}50%{opacity:1}}

/* ═══════════════════════════════════════
   GESTURE DETECTION
   Canonical anime signs:
   Sukuna  : prayer hands, BOTH index fingers pointing up
             → detect: index UP, middle DOWN, ring DOWN, pinky DOWN  (1 finger up)
   Gojo    : middle crossed BEHIND index (Taishakuten-in)
             → detect: index UP, middle UP, ring DOWN, pinky DOWN    (2 fingers up, 🤞 like)
   Red     : index + pinky out, middle+ring folded (devil horns)
             → detect: index UP, middle DOWN, ring DOWN, pinky UP
   Purple  : thumb+index pinch, middle extended
             → detect: index DOWN (pinched), middle UP, ring DOWN, pinky DOWN
═══════════════════════════════════════ */
function classify(L){
  if(!L||L.length<21) return '';
  const UP =(t,p)=>L[t].y < L[p].y - 0.027;
  const DN =(t,p)=>L[t].y > L[p].y + 0.012;
  // Thumb extended check (tip far from base)
  const thumbOut = Math.abs(L[4].x-L[3].x) > 0.06;

  const iUp=UP(8,6), mUp=UP(12,10), rUp=UP(16,14), pUp=UP(20,18);
  const iDn=DN(8,6), mDn=DN(12,10), rDn=DN(16,14), pDn=DN(20,18);

  // Hollow Purple: middle up, index+ring+pinky down (pinched look)
  if(!iUp && mUp && !rUp && !pUp) return 'purple';
  // Reversal Red: index + pinky up, middle+ring down (devil horns)
  if(iUp && !mUp && !rUp && pUp)  return 'red';
  // Gojo domain: index + middle up, ring+pinky down (crossed fingers look)
  if(iUp && mUp && !rUp && !pUp)  return 'gojo';
  // Sukuna domain: only index up (prayer, single point)
  if(iUp && !mUp && !rUp && !pUp) return 'sukuna';

  return '';
}

/* ═══════════════════════════════════════
   AURA RENDERING
═══════════════════════════════════════ */
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function drawAura(lms,t){
  if(!lms) return;
  const W=OL.width, H=OL.height;
  const pal=PAL[mode||''];
  const pts=lms.map(l=>({x:l.x*W, y:l.y*H}));
  const pulse=0.54+0.46*Math.sin(t*.0035);

  ctx.save(); ctx.scale(-1,1); ctx.translate(-W,0);

  // Pass 1: wide diffuse glow
  ctx.lineWidth=pal.glow; ctx.lineCap='round';
  for(const [a,b] of BONES){
    ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y);
    ctx.strokeStyle=pal.a+'0.09)'; ctx.stroke();
  }
  // Pass 2: medium glow
  ctx.lineWidth=pal.glow*.36;
  for(const [a,b] of BONES){
    ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y);
    ctx.strokeStyle=pal.b+'0.17)'; ctx.stroke();
  }
  // Pass 3: bright core
  ctx.lineWidth=pal.bone;
  for(const [a,b] of BONES){
    const g=ctx.createLinearGradient(pts[a].x,pts[a].y,pts[b].x,pts[b].y);
    g.addColorStop(0,pal.a+(pulse*.93)+')'); g.addColorStop(.5,pal.c+(pulse*.86)+')'); g.addColorStop(1,pal.a+(pulse*.93)+')');
    ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y);
    ctx.strokeStyle=g; ctx.stroke();
  }

  // Joints
  const joints=mode?[0,4,5,8,9,12,13,16,17,20]:[0,8];
  for(const i of joints){
    const p=pts[i], br=(i===0?13:7.5)*pulse;
    const h=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,br*3);
    h.addColorStop(0,pal.a+'0.54)'); h.addColorStop(.55,pal.a+'0.11)'); h.addColorStop(1,pal.a+'0)');
    ctx.beginPath(); ctx.arc(p.x,p.y,br*3,0,Math.PI*2); ctx.fillStyle=h; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x,p.y,br*.4,0,Math.PI*2); ctx.fillStyle=pal.c+'0.97)'; ctx.fill();
  }

  if(mode){
    const px=(pts[0].x+pts[9].x)/2, py=(pts[0].y+pts[9].y)/2;
    // Domain-specific palm effect
    if(mode==='red'||mode==='purple'){
      const or=58+32*Math.sin(t*.0024);
      const og=ctx.createRadialGradient(px,py,0,px,py,or);
      og.addColorStop(0,pal.c+'0.38)'); og.addColorStop(.5,pal.a+'0.2)'); og.addColorStop(1,pal.a+'0)');
      ctx.beginPath(); ctx.arc(px,py,or,0,Math.PI*2); ctx.fillStyle=og; ctx.fill();
      ctx.beginPath(); ctx.arc(px,py,14*pulse,0,Math.PI*2); ctx.fillStyle=pal.c+'0.92)'; ctx.fill();
    }
    // Orbital particles
    const N=mode==='purple'?12:mode==='gojo'?10:8;
    const spd=mode==='sukuna'?-1.6:1.2;
    for(let i=0;i<N;i++){
      const ang=t*.0022*spd+i*(Math.PI*2/N);
      const dist=52+24*Math.sin(t*.003+i*1.1);
      const ox=px+Math.cos(ang)*dist, oy=py+Math.sin(ang)*dist;
      const pr=2+1.9*Math.sin(t*.005+i*2.1);
      ctx.beginPath(); ctx.arc(ox,oy,pr,0,Math.PI*2);
      ctx.fillStyle=pal.b+(0.5+0.44*Math.sin(t*.004+i))+')'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ox,oy);
      ctx.strokeStyle=pal.a+'0.055)'; ctx.lineWidth=.7; ctx.stroke();
    }
    // Palm ripple
    const rr=68+32*Math.sin(t*.0018);
    const rg=ctx.createRadialGradient(px,py,rr*.44,px,py,rr);
    rg.addColorStop(0,pal.a+'0)'); rg.addColorStop(.65,pal.a+'0.12)'); rg.addColorStop(1,pal.a+'0)');
    ctx.beginPath(); ctx.arc(px,py,rr,0,Math.PI*2); ctx.fillStyle=rg; ctx.fill();
    // Fingertip sparks
    for(const ti of [4,8,12,16,20]){
      const tp=pts[ti]; const sr=3+2.2*Math.sin(t*.006+ti);
      const sg=ctx.createRadialGradient(tp.x,tp.y,0,tp.x,tp.y,sr*2.6);
      sg.addColorStop(0,pal.c+'.74)'); sg.addColorStop(1,pal.a+'0)');
      ctx.beginPath(); ctx.arc(tp.x,tp.y,sr*2.6,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
      ctx.beginPath(); ctx.arc(tp.x,tp.y,sr*.36,0,Math.PI*2); ctx.fillStyle=pal.c+'.97)'; ctx.fill();
    }
  }
  ctx.restore();
}

/* ═══════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════ */
let mpData=null;
function loop(ts){
  ctx.clearRect(0,0,OL.width,OL.height);
  const lms=mpData?.multiHandLandmarks?.[0]||null;

  if(lms){
    drawAura(lms,ts);
    const g=classify(lms);

    if(g!==lastGest){
      lastGest=g; stopCharge();
      if(!mode){
        setCards('','');
        if(g){
          const mt=META[g];
          pill.className=mt.pc; pill.textContent=mt.kanji+' — hold…';
          setCards('lit','',g[0]);
          startCharge(g);
        } else {
          pill.className='det'; pill.textContent='show your hand sign';
        }
      } else {
        if(!g){ deactivate(false); pill.className='det'; pill.textContent='show your hand sign'; }
      }
    }
  } else {
    if(lastGest||mode){
      lastGest=''; stopCharge(); setCards('','');
      if(mode){ deactivate(false); }
      if(mpData){ pill.className='det'; pill.textContent='show your hand'; }
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═══════════════════════════════════════
   MEDIAPIPE
═══════════════════════════════════════ */
ldP.style.width='14%';
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.72,minTrackingConfidence:.66});
hands.onResults(r=>{

      loader.style.opacity='0';
      setTimeout(()=>loader.style.display='none',950);
      pill.className='det'; pill.textContent='show your hand sign';
    },500);
  }
});
ldP.style.width='46%'; ldM.textContent='starting camera…';
const camera=new Camera(video,{
  onFrame:async()=>await hands.send({image:video}),
  width:1280,height:720
});
camera.start()
  .then(()=>{ ldP.style.width='82%'; ldM.textContent='loading model…'; })
  .catch(e=>{ ldM.textContent='camera error: '+e.message; ldP.style.background='#f43'; });
</script>
